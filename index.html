<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Website Builder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #25252d;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            color: #aaa;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #17171d;
            color: white;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #777;
        }

        button {
            margin-top: 15px;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin: 20px 0;
            color: #aaa;
        }

        .preview-box {
            margin-top: 25px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            min-height: 600px;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: none;
            background: white;
        }
    </style>
</head>

<body>

<header>
    <h1>⚡ AI Website Builder</h1>
    <p>Describe your website and let AI build it.</p>
</header>

<div class="container">

    <textarea
        id="prompt"
        placeholder="Example: Create a premium luxury kitchen remodeling website for a company in Phoenix, Arizona. Include a hero section, services, gallery, testimonials, about section and contact form."
    ></textarea>

    <br>

    <button id="generateBtn" onclick="generateWebsite()">
        Generate Website
    </button>

    <div id="status"></div>

    <div class="preview-box">
        <iframe id="preview"></iframe>
    </div>

</div>

<script>

async function generateWebsite() {

    const prompt = document.getElementById("prompt").value.trim();
    const button = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    if (!prompt) {
        alert("Please describe the website first.");
        return;
    }

    button.disabled = true;
    button.textContent = "Generating...";
    status.textContent = "🤖 Gemini is creating your website...";

    try {

        const response = await fetch("/generate", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                prompt: prompt
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Generation failed");
        }

        preview.srcdoc = data.website;

        status.textContent = "✅ Website generated successfully!";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Error: " + error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Generate Website";

    }
}

</script>

</body>
</html>
